name: Update Gaming News

on:
  schedule:
    # Runs every 30 minutes (UTC)
    - cron: "*/30 * * * *"
  # Allows manual one-click trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gaming-news
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and rewrite gaming news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit and push updated news.json
        run: |
          if git diff --quiet data/news.json; then
            echo "No new articles to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json
          git commit -m "chore(news): auto-update gaming news [automated]"
          git pull --rebase origin main
          git push origin main
